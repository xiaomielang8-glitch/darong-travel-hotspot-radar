name: Travel Hotspot V0.4 Platform Discovery Probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_cn_hot_platforms.py'
      - '.github/workflows/travel-hotspot-v0-3-hot-platform-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'

      - name: Install dependencies
        run: uv sync

      - name: Validate probe syntax
        run: uv run python -m py_compile scripts/probe_cn_hot_platforms.py

      - name: Probe Chinese platforms with strict 24h rule
        run: uv run python scripts/probe_cn_hot_platforms.py

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-hotspot-v0-4-platform-discovery-probe
          path: data/probes/cn-hot-platforms-v0-4-*
          if-no-files-found: warn
          retention-days: 7
