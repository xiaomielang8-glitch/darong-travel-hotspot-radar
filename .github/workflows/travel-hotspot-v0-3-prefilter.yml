name: Travel Hotspot V0.3 Candidate Prefilter

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 22:00 UTC = 06:00 China Standard Time (UTC+8).
    - cron: '0 22 * * *'
  pull_request:
    paths:
      - 'scripts/build_travel_candidate_prefilter.py'
      - 'scripts/refine_travel_candidate_pool.py'
      - 'scripts/feedparser.py'
      - '.github/workflows/travel-hotspot-v0-3-prefilter.yml'

jobs:
  prefilter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'

      - name: Install dependencies
        run: uv sync

      - name: Validate prefilter syntax
        run: |
          uv run python -m py_compile scripts/build_travel_candidate_prefilter.py
          uv run python -m py_compile scripts/refine_travel_candidate_pool.py
          uv run python -m py_compile scripts/feedparser.py

      - name: Build strict-24h raw pre-candidate pool
        run: uv run python scripts/build_travel_candidate_prefilter.py

      - name: Validate raw pool
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('data/candidate-pools').glob('travel-prefilter-*.json'))
          if not files:
              raise SystemExit('No prefilter JSON produced')
          data = json.loads(files[-1].read_text(encoding='utf-8'))
          if data.get('strict_window_hours') != 24:
              raise SystemExit('Strict 24h gate missing')
          count = len(data.get('candidates', []))
          if count == 0:
              raise SystemExit('Prefilter produced zero candidates')
          if count > 60:
              raise SystemExit(f'Prefilter exceeded pool cap: {count}')
          print(f'Raw prefilter gate OK: {count} candidates')
          PY

      - name: Refine without LLM
        run: uv run python scripts/refine_travel_candidate_pool.py

      - name: Validate refined pool
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('data/candidate-pools').glob('travel-refined-*.json'))
          if not files:
              raise SystemExit('No refined JSON produced')
          data = json.loads(files[-1].read_text(encoding='utf-8'))
          if data.get('strict_window_hours') != 24:
              raise SystemExit('Refined pool lost strict 24h gate')
          count = len(data.get('candidates', []))
          if count < 12:
              raise SystemExit(f'Refined pool too small: {count}')
          if count > 35:
              raise SystemExit(f'Refined pool too large: {count}')
          print(f'Refined business gate OK: {count} candidates; no LLM used')
          PY

      - name: Upload prefilter output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-hotspot-v0-3-prefilter
          path: data/candidate-pools/**
          if-no-files-found: warn
          retention-days: 7
